    // Độ rộng thật của phần tử (px) — để biểu đồ đường vẽ đúng pixel, chữ không bị phóng to
    function useWidth(ref) {
      const [w, setW] = useState(0);
      useEffect(() => {
        const el = ref.current;
        if (!el || typeof ResizeObserver === 'undefined') { if (el) setW(el.clientWidth); return; }
        const ro = new ResizeObserver((entries) => setW(Math.round(entries[0].contentRect.width)));
        ro.observe(el);
        return () => ro.disconnect();
      }, []);
      return w;
    }

    // Nội suy monotone cubic (tương đương d3 curveMonotoneX): tiếp tuyến bị chặn nên
    // đường cong không vượt ra ngoài khoảng giữa hai điểm liền kề (không sinh FPS âm).
    function monotonePath(p) {
      const n = p.length;
      const s = [];
      for (let i = 0; i < n - 1; i++) {
        const h = p[i + 1].x - p[i].x;
        s.push(h ? (p[i + 1].y - p[i].y) / h : 0);
      }
      const m = new Array(n);
      m[0] = s[0];
      m[n - 1] = s[n - 2];
      for (let i = 1; i < n - 1; i++) {
        const s0 = s[i - 1], s1 = s[i];
        if (s0 * s1 <= 0) { m[i] = 0; continue; }
        const h0 = p[i].x - p[i - 1].x, h1 = p[i + 1].x - p[i].x;
        const pm = (s0 * h1 + s1 * h0) / (h0 + h1);
        m[i] = 2 * Math.sign(s0) * Math.min(Math.abs(s0), Math.abs(s1), 0.5 * Math.abs(pm));
      }
      let d = `M${p[0].x},${p[0].y}`;
      for (let i = 0; i < n - 1; i++) {
        const dx = (p[i + 1].x - p[i].x) / 3;
        d += ` C${p[i].x + dx},${p[i].y + dx * m[i]} ${p[i + 1].x - dx},${p[i + 1].y - dx * m[i + 1]} ${p[i + 1].x},${p[i + 1].y}`;
      }
      return d;
    }

    // Icon "i" có tooltip: mở khi hover (chuột), khi click/chạm, khi focus bằng bàn phím;
    // đóng khi click ra ngoài hoặc nhấn Esc.
    function InfoTip({ label, children }) {
      const [hover, setHover] = useState(false);
      const [pinned, setPinned] = useState(false);
      const wrapRef = useRef(null);
      const open = hover || pinned;
      useEffect(() => {
        if (!open) return;
        const onDown = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) { setPinned(false); setHover(false); } };
        const onKey = (e) => { if (e.key === 'Escape') { setPinned(false); setHover(false); } };
        document.addEventListener('pointerdown', onDown);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('pointerdown', onDown);
          document.removeEventListener('keydown', onKey);
        };
      }, [open]);
      return (
        <span ref={wrapRef} className="relative inline-flex"
              onPointerEnter={(e) => { if (e.pointerType === 'mouse') setHover(true); }}
              onPointerLeave={(e) => { if (e.pointerType === 'mouse') setHover(false); }}>
          <button type="button" aria-label={label} aria-expanded={open} aria-describedby={open ? 'info-tip' : undefined}
                  onClick={() => setPinned((v) => !v)}
                  onFocus={(e) => { if (e.currentTarget.matches(':focus-visible')) setPinned(true); }}
                  onBlur={() => setPinned(false)}
                  className="info-btn">i</button>
          {open && (
            <div id="info-tip" role="tooltip"
                 className="fade-in absolute left-0 top-full mt-2 z-30 w-[min(30rem,calc(100vw-2.5rem))] rounded-lg border border-white/10 px-3 py-2.5 text-[12px] leading-5 text-zinc-300 normal-case tracking-normal font-normal"
                 style={{ background: 'var(--panel-2)', boxShadow: '0 8px 24px rgba(0,0,0,.5)' }}>
              {children}
            </div>
          )}
        </span>
      );
    }

    // ── Biểu đồ cột: so sánh 1 / 2 / 3 leaf cho một thông số ─────
    function BarCompare({ metric, aggs, nLabel = 'mẫu' }) {
      const [hover, setHover] = useState(null);
      const W = 320, H = 200, padL = 44, padR = 8, padT = 22, padB = 30;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const rows = LEAVES.map((l) => ({ leaf: l, a: aggs[l] }));
      const hasAny = rows.some((r) => r.a && r.a.n);
      const yMax = niceMax(Math.max(0, ...rows.filter((r) => r.a && r.a.n).map((r) => r.a.max)));
      const y = (v) => padT + plotH - (v / yMax) * plotH;
      const band = plotW / LEAVES.length;
      const bw = Math.round(band * 0.5), r = 4;
      const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * yMax);
      const y0 = y(0);
      const ghostH = plotH * 0.25;

      return (
        <div className="panel p-3 relative transition-opacity duration-200" style={{ opacity: hasAny ? 1 : 0.6 }}>
          <div className="flex justify-between items-baseline gap-2 mb-1">
            <div className="text-[12px] leading-4 text-zinc-400">{metric.label}</div>
            <div className="mono text-[11px] text-zinc-500 shrink-0">{metric.unit}</div>
          </div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" onMouseLeave={() => setHover(null)}
               role="img" aria-label={`${metric.label}, so sánh 1, 2, 3 drone`}>
            {ticks.map((t, i) => (
              <g key={i}>
                <line x1={padL} x2={W - padR} y1={y(t)} y2={y(t)} stroke={i === 0 ? '#3f3f46' : 'var(--grid)'} strokeWidth="1" />
                {hasAny && (
                  <text x={padL - 6} y={y(t) + 3} textAnchor="end" fontSize="10" fill="var(--text-3)" className="mono">
                    {Number(t.toPrecision(3))}
                  </text>
                )}
              </g>
            ))}
            {rows.map((row, i) => {
              const cx = padL + band * i + band / 2;
              const x0 = cx - bw / 2;
              const m = aggMean(row.a);
              const label = <text x={cx} y={H - 10} textAnchor="middle" fontSize="11" fill="var(--text-2)">{row.leaf} drone</text>;
              if (m == null) {
                return (
                  <g key={row.leaf}>
                    <title>{`${row.leaf} drone: chưa có dữ liệu`}</title>
                    <rect x={x0 + 0.5} y={y0 - ghostH} width={bw - 1} height={ghostH - 0.5} rx="3"
                          fill="none" stroke="rgba(255,255,255,.1)" strokeWidth="1" strokeDasharray="4 3" />
                    {label}
                  </g>
                );
              }
              // Giá trị 0 vẫn vẽ vạch cao tối thiểu 2px để phân biệt với cột trống
              const hBar = Math.max(2, y0 - y(m));
              const yt = y0 - hBar;
              const d = hBar > r
                ? `M${x0},${y0} V${yt + r} Q${x0},${yt} ${x0 + r},${yt} H${x0 + bw - r} Q${x0 + bw},${yt} ${x0 + bw},${yt + r} V${y0} Z`
                : `M${x0},${y0} V${yt} H${x0 + bw} V${y0} Z`;
              const hi = hover === i;
              return (
                <g key={row.leaf}>
                  <path className="bar" d={d} style={{ d: `path("${d}")` }} fill={LEAF_COLOR[row.leaf]} opacity={hover == null || hi ? 1 : 0.45} />
                  {row.a.n > 1 && (
                    <g stroke="var(--text-2)" strokeWidth="1.5">
                      <line x1={cx} x2={cx} y1={y(row.a.max)} y2={y(row.a.min)} />
                      <line x1={cx - 5} x2={cx + 5} y1={y(row.a.max)} y2={y(row.a.max)} />
                      <line x1={cx - 5} x2={cx + 5} y1={y(row.a.min)} y2={y(row.a.min)} />
                    </g>
                  )}
                  <text x={cx} y={Math.min(yt, y(row.a.max)) - 6} textAnchor="middle" fontSize="11" fill="var(--text)" className="mono">
                    {fmt(m, metric.digits)}
                  </text>
                  {label}
                  <rect x={padL + band * i} y={padT} width={band} height={plotH + padB} fill="transparent"
                        onMouseEnter={() => setHover(i)} />
                </g>
              );
            })}
          </svg>
          {hover != null && rows[hover].a && (
            <div className="fade-in absolute z-10 pointer-events-none mono text-[11px] bg-black/90 rounded-md shadow-lg px-2 py-1.5 leading-4"
                 style={{ left: `${((padL + band * hover + band / 2) / W) * 100}%`, top: 34, transform: 'translateX(-50%)' }}>
              <div className="flex items-center gap-1.5 text-zinc-200">
                <span className="w-2 h-2 rounded-sm" style={{ background: LEAF_COLOR[rows[hover].leaf] }}></span>
                {rows[hover].leaf} drone
              </div>
              <div className="text-zinc-400">TB&nbsp; <span className="text-zinc-100">{fmt(aggMean(rows[hover].a), metric.digits)}</span> {metric.unit}</div>
              <div className="text-zinc-400">min {fmt(rows[hover].a.min, metric.digits)} · max {fmt(rows[hover].a.max, metric.digits)}</div>
              <div className="text-zinc-500">n = {rows[hover].a.n} {nLabel}</div>
            </div>
          )}
        </div>
      );
    }

    // ── Biểu đồ vùng: diễn biến theo thời gian, tô màu theo số leaf ──
    function Timeline({ timeline, metric }) {
      const [hover, setHover] = useState(null);
      const wrapRef = useRef(null);
      const W = useWidth(wrapRef);
      const H = 260, padL = 48, padR = 14, padT = 14, padB = 24;
      const plotW = Math.max(1, W - padL - padR), plotH = H - padT - padB;
      const pts = timeline.map((s, i) => ({ i, s, v: s[metric.key] })).filter((p) => Number.isFinite(p.v));
      const enough = pts.length >= 2;

      const yMax = enough ? niceMax(Math.max(...pts.map((p) => p.v))) : 1;
      const x = (k) => padL + (k / Math.max(1, pts.length - 1)) * plotW;
      const y = (v) => padT + plotH - (v / yMax) * plotH;
      const y0 = y(0);
      const ticks = [0, 0.25, 0.5, 0.75, 1];

      // Tách thành các đoạn liên tục cùng số leaf và không bị ngắt quãng thời gian
      const segs = [];
      if (enough) {
        pts.forEach((p, k) => {
          const prev = pts[k - 1];
          const cont = prev && prev.s.leaf === p.s.leaf && p.s.t - prev.s.t < 15000;
          if (!cont) segs.push({ leaf: p.s.leaf, pts: [] });
          segs[segs.length - 1].pts.push({ k, v: p.v });
        });
      }
      const leavesUsed = [...new Set(segs.map((sg) => sg.leaf))];
      const gradId = (leaf) => `tl-grad-${metric.key}-${leaf}`;

      const onMove = (e) => {
        if (!enough || !wrapRef.current) return;
        const rect = wrapRef.current.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const k = Math.round(((px - padL) / plotW) * (pts.length - 1));
        setHover(Math.max(0, Math.min(pts.length - 1, k)));
      };
      const hp = enough && hover != null ? pts[hover] : null;

      return (
        <div className="panel p-3">
          <div className="flex justify-between items-baseline gap-2 mb-2">
            <div className="text-[12px] text-zinc-400">{metric.label}</div>
            <div className="mono text-[11px] text-zinc-500">{metric.unit}</div>
          </div>
          <div ref={wrapRef} className="relative w-full" style={{ height: H }}>
            {W > 0 && (
              <svg width={W} height={H} className="block" onMouseMove={onMove} onMouseLeave={() => setHover(null)}
                   role="img" aria-label={`${metric.label} theo thời gian`}>
                {enough && (
                  <defs>
                    {leavesUsed.map((l) => (
                      <linearGradient key={l} id={gradId(l)} x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" style={{ stopColor: LEAF_COLOR[l], stopOpacity: 0.35 }} />
                        <stop offset="100%" style={{ stopColor: LEAF_COLOR[l], stopOpacity: 0 }} />
                      </linearGradient>
                    ))}
                  </defs>
                )}
                {ticks.map((f, i) => (
                  <g key={i}>
                    <line x1={padL} x2={W - padR} y1={y(f * yMax)} y2={y(f * yMax)} stroke={i === 0 ? '#3f3f46' : 'var(--grid)'} />
                    {enough && (
                      <text x={padL - 8} y={y(f * yMax) + 3} textAnchor="end" fontSize="10" fill="var(--text-3)" className="mono">
                        {Number((f * yMax).toPrecision(3))}
                      </text>
                    )}
                  </g>
                ))}
                {enough ? (
                  <g>
                    <text x={padL} y={H - 6} fontSize="10" fill="var(--text-3)">mẫu cũ nhất</text>
                    <text x={W - padR} y={H - 6} fontSize="10" fill="var(--text-3)" textAnchor="end">mới nhất</text>
                    {segs.map((sg, j) => {
                      if (sg.pts.length === 1) {
                        return <circle key={j} cx={x(sg.pts[0].k)} cy={y(sg.pts[0].v)} r="2.5" fill={LEAF_COLOR[sg.leaf]} />;
                      }
                      const pp = sg.pts.map((q) => ({ x: x(q.k), y: y(q.v) }));
                      const line = monotonePath(pp);
                      const area = `${line} L${pp[pp.length - 1].x},${y0} L${pp[0].x},${y0} Z`;
                      return (
                        <g key={j}>
                          <path d={area} fill={`url(#${gradId(sg.leaf)})`} stroke="none" />
                          <path d={line} fill="none" stroke={LEAF_COLOR[sg.leaf]} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
                        </g>
                      );
                    })}
                    {hp && (
                      <g>
                        <line x1={x(hover)} x2={x(hover)} y1={padT} y2={padT + plotH} stroke="#52525b" strokeWidth="1" />
                        <circle cx={x(hover)} cy={y(hp.v)} r="4" fill={LEAF_COLOR[hp.s.leaf]} stroke="var(--panel)" strokeWidth="2" />
                      </g>
                    )}
                  </g>
                ) : (
                  <text x={padL + plotW / 2} y={padT + plotH / 2 + 4} textAnchor="middle" fontSize="12" fill="var(--text-3)">
                    Chưa đủ dữ liệu để vẽ
                  </text>
                )}
              </svg>
            )}
            {hp && (
              <div className="absolute z-10 pointer-events-none mono text-[11px] bg-black/90 rounded-md shadow-lg px-2 py-1.5 leading-4"
                   style={{ left: x(hover), top: 8, transform: `translateX(${hover > pts.length / 2 ? 'calc(-100% - 10px)' : '10px'})` }}>
                <div className="text-zinc-400">{new Date(hp.s.t).toLocaleString('vi-VN')}</div>
                <div className="flex items-center gap-1.5 text-zinc-200">
                  <span className="w-2 h-2 rounded-sm" style={{ background: LEAF_COLOR[hp.s.leaf] }}></span>
                  {hp.s.leaf} drone · {fmt(hp.v, metric.digits)} {metric.unit}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── Tab so sánh ──────────────────────────────────────────────
    function CompareTab({ store, recording, setRecording, onReset, currentLeaf }) {
      const { stats, timeline } = store;
      const healAggs = useMemo(() => {
        const o = {};
        LEAVES.forEach((l) => { o[l] = aggOf(stats[l].healNew || []); });
        return o;
      }, [stats]);
      const healOldAggs = useMemo(() => {
        const o = {};
        LEAVES.forEach((l) => { o[l] = aggOf(stats[l].heal || []); });
        return o;
      }, [stats]);
      // Latency theo hop: ghép lat_by_node với hop_by_node của CÙNG mẫu. Mỗi cặp (mẫu, node) có cả
      // latency lẫn hop là 1 giá trị; node thiếu một trong hai thì bỏ qua.
      const latByHop = useMemo(() => {
        const o = {};   // hop -> leaf -> [ms]
        timeline.forEach((s) => {
          if (!s.latByNode || !s.hopByNode) return;
          const hopOf = {};
          s.hopByNode.split(';').forEach((p) => { const [id, h] = p.split(':'); hopOf[id] = Number(h); });
          s.latByNode.split(';').forEach((p) => {
            const [id, v] = p.split(':');
            const h = hopOf[id], ms = Number(v);
            if (!Number.isFinite(h) || !Number.isFinite(ms)) return;
            ((o[h] ||= {})[s.leaf] ||= []).push(ms);
          });
        });
        return Object.keys(o).map(Number).sort((a, b) => a - b).map((h) => ({
          hop: h, aggs: Object.fromEntries(LEAVES.map((l) => [l, aggOf(o[h][l] || [])])),
        }));
      }, [timeline]);
      const metricAggs = (key) => {
        const o = {};
        LEAVES.forEach((l) => { o[l] = stats[l].metrics[key]; });
        return o;
      };

      const exportCsv = () => {
        const cols = [...METRICS.map((m) => m.key), ...CSV_EXTRA];
        const head = ['time', 'leaf', ...cols, ...CSV_TOPO.map(([, name]) => name), ...CSV_META.map(([, name]) => name)];
        const lines = [head.join(',')];
        timeline.forEach((s) => lines.push([
          new Date(s.t).toISOString(), s.leaf,
          ...cols.map((k) => (Number.isFinite(s[k]) ? s[k].toFixed(4) : '')),
          ...CSV_TOPO.map(([k]) => (s[k] == null ? '' : String(s[k]))),
          ...CSV_META.map(([k]) => (s[k] == null ? '' : String(s[k]))),
        ].join(',')));
        lines.push('');
        lines.push('summary_leaf,metric,n,mean,sd,min,max');
        LEAVES.forEach((l) => {
          [...METRICS.map((m) => [m.key, stats[l].metrics[m.key]]), ['heal_ms_moi', healAggs[l]], ['heal_ms_cu', healOldAggs[l]]].forEach(([k, a]) => {
            if (a) lines.push([l, k, a.n, aggMean(a).toFixed(4), aggSd(a) != null ? aggSd(a).toFixed(4) : '', a.min, a.max].join(','));
          });
        });
        // Từng sự kiện self-healing: heal_ms_moi (heal_events, theo node) / heal_ms_cu (last_self_heal_ms)
        lines.push('');
        lines.push('heal_time,leaf,node_id,heal_ms_moi,heal_ms_cu,start_src');
        (store.healLog || []).forEach((e) => lines.push([
          new Date(e.t).toISOString(), e.leaf, e.kind === 'moi' ? e.id : '',
          e.kind === 'moi' ? e.ms : '', e.kind === 'cu' ? e.ms : '', e.kind === 'moi' ? (e.src || '') : '',
        ].join(',')));
        const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `mesh_so_sanh_leaf_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      };

      const cell = (a, d) => {
        const m = aggMean(a);
        if (m == null) return <span className="font-sans italic font-normal text-[11px] text-zinc-500/60">chưa có dữ liệu</span>;
        const sd = aggSd(a);
        return (
          <span>
            <span className="text-zinc-50 font-semibold">{fmt(m, d)}</span>
            {sd != null && <span className="text-zinc-500 text-[11px]"> ± {fmt(sd, d)}</span>}
          </span>
        );
      };
      const delta = (a, base) => {
        const m = aggMean(a), b = aggMean(base);
        if (m == null || b == null || b === 0) return null;
        const p = ((m - b) / Math.abs(b)) * 100;
        return <span className="text-zinc-500 text-[11px] ml-1">({p >= 0 ? '+' : ''}{p.toFixed(0)}%)</span>;
      };

      const leafWarn = currentLeaf != null && !LEAVES.includes(currentLeaf);
      const rowCls = 'border-b border-white/5 even:bg-white/[0.02] hover:bg-white/5 transition-colors duration-150';
      const thStyle = { background: 'var(--panel)' };

      return (
        <div className="p-3 sm:p-4 flex flex-col gap-3 max-w-[1600px] mx-auto w-full">
          {/* Điều khiển ghi */}
          <div className="panel p-3 flex flex-wrap items-center gap-x-4 gap-y-3">
            <div className="flex items-center gap-2">
              <span className="panel-h">Ghi số liệu</span>
              <InfoTip label="Cách đo">
                Cách đo: bật lần lượt 1, 2, 3 Camera Node; mỗi cấu hình để chạy vài phút. Mỗi lần Root gửi telemetry, dashboard tính
                tốc độ thay đổi của <span className="mono">frames_ok / frames_drop / chunks</span> so với lần trước và gán mẫu vào nhóm theo
                <span className="mono"> node_count</span>. Các mẫu lúc số drone đang thay đổi hoặc Root khởi động lại bị bỏ qua.
                Cột = giá trị trung bình, vạch = min–max. Dữ liệu lưu trong trình duyệt này.
              </InfoTip>
            </div>
            <div className="btn-group">
              <button onClick={() => setRecording(!recording)} aria-pressed={recording}
                      className={`btn mono inline-flex items-center gap-2 ${recording ? '!text-red-300' : ''}`}>
                <span className={`rec-dot ${recording ? 'rec-on' : ''}`} aria-hidden="true"></span>
                {recording ? 'Đang ghi' : 'Tạm dừng ghi'}
              </button>
              <button onClick={exportCsv} disabled={!timeline.length} className="btn mono">Xuất CSV</button>
              <button onClick={onReset} className="btn mono hover:!text-red-300 hover:!bg-red-950/40">Xoá dữ liệu</button>
            </div>
            <div className="ml-auto flex flex-wrap items-center gap-2">
              <span className={`chip mono ${leafWarn ? 'border-yellow-400/60 text-yellow-300' : 'border-white/10 text-zinc-300'}`}>
                DRONE HIỆN TẠI:
                <span className={`font-semibold ${leafWarn ? '' : 'text-[color:var(--accent)]'}`}>{currentLeaf ?? '—'}</span>
                {leafWarn && <span className="font-normal">· ngoài 1–3, không ghi</span>}
              </span>
              {LEAVES.map((l) => (
                <span key={l} className="chip mono border-white/10 text-zinc-300">
                  <span className="w-2 h-2 rounded-full" style={{ background: LEAF_COLOR[l] }} aria-hidden="true"></span>
                  {l} drone · <span className="text-zinc-50 font-semibold">{stats[l].samples}</span> mẫu
                </span>
              ))}
            </div>
          </div>

          {/* Biểu đồ so sánh */}
          <div className="panel-h px-1 pt-1">So sánh trung bình theo số drone</div>
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
            {METRICS.map((m) => <BarCompare key={m.key} metric={m} aggs={metricAggs(m.key)} />)}
            <BarCompare metric={HEAL_METRIC} aggs={healAggs} nLabel="sự kiện" />
          </div>

          {/* Diễn biến theo thời gian */}
          <div className="panel-h px-1 pt-1">Diễn biến theo thời gian</div>
          <div className="flex flex-col gap-3">
            <Timeline timeline={timeline} metric={METRICS[0]} />
            <Timeline timeline={timeline} metric={METRICS[2]} />
            <Timeline timeline={timeline} metric={METRICS.find((m) => m.key === 'latMs')} />
          </div>

          {/* Bảng số liệu */}
          <div className="panel">
            <div className="panel-h px-3 pt-3 pb-2">Bảng so sánh (trung bình ± độ lệch chuẩn, % so với 1 drone)</div>
            <div className="overflow-auto max-h-[70vh] rounded-b-lg">
              <table className="w-full mono text-[12px]">
                <thead>
                  <tr className="text-zinc-500">
                    <th className="sticky top-0 z-[1] text-left font-normal px-3 py-2 border-b border-white/10" style={thStyle}>Thông số</th>
                    <th className="sticky top-0 z-[1] text-left font-normal px-3 py-2 border-b border-white/10" style={thStyle}>Đơn vị</th>
                    {LEAVES.map((l) => (
                      <th key={l} className="sticky top-0 z-[1] text-right font-normal px-3 py-2 border-b border-white/10" style={thStyle}>
                        <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background: LEAF_COLOR[l] }}></span>{l} drone</span>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {METRICS.map((m) => (
                    <tr key={m.key} className={`${rowCls} text-zinc-200`}>
                      <td className="px-3 py-1.5 font-sans">{m.label}</td>
                      <td className="px-3 py-1.5 text-zinc-500">{m.unit}</td>
                      {LEAVES.map((l) => (
                        <td key={l} className="px-3 py-1.5 text-right whitespace-nowrap">
                          {cell(stats[l].metrics[m.key], m.digits)}{l > 1 && delta(stats[l].metrics[m.key], stats[1].metrics[m.key])}
                        </td>
                      ))}
                    </tr>
                  ))}
                  {[[HEAL_METRIC, healAggs, 'text-zinc-200'], [HEAL_OLD_METRIC, healOldAggs, 'text-zinc-400']].map(([m, aggs, cls]) => (
                    <tr key={m.key} className={`${rowCls} ${cls}`}>
                      <td className="px-3 py-1.5 font-sans">{m.label}</td>
                      <td className="px-3 py-1.5 text-zinc-500">ms</td>
                      {LEAVES.map((l) => (
                        <td key={l} className="px-3 py-1.5 text-right whitespace-nowrap">
                          {cell(aggs[l], 0)}{aggs[l] && <span className="text-zinc-500 text-[11px]"> · {aggs[l].n} sự kiện · {aggs[l].min}–{aggs[l].max}</span>}
                        </td>
                      ))}
                    </tr>
                  ))}
                  <tr className={`${rowCls} text-zinc-400`}>
                    <td className="px-3 py-1.5 font-sans">Số mẫu đo</td>
                    <td className="px-3 py-1.5 text-zinc-500">mẫu</td>
                    {LEAVES.map((l) => <td key={l} className="px-3 py-1.5 text-right text-zinc-200">{stats[l].samples}</td>)}
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          {/* Bảng phụ: latency theo hop */}
          <div className="panel">
            <div className="panel-h px-3 pt-3 pb-2">Latency trung bình theo hop (ms, trung bình ± độ lệch chuẩn)</div>
            {latByHop.length === 0 ? (
              <div className="px-3 pb-3 text-[12px] text-zinc-500">chưa có dữ liệu — cần mẫu có cả lat_by_node và hop_by_node</div>
            ) : (
              <div className="overflow-auto rounded-b-lg">
                <table className="w-full mono text-[12px]">
                  <thead>
                    <tr className="text-zinc-500">
                      <th className="text-left font-normal px-3 py-2 border-b border-white/10">Hop</th>
                      {LEAVES.map((l) => (
                        <th key={l} className="text-right font-normal px-3 py-2 border-b border-white/10">
                          <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background: LEAF_COLOR[l] }}></span>{l} drone</span>
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {latByHop.map((r) => (
                      <tr key={r.hop} className={`${rowCls} text-zinc-200`}>
                        <td className="px-3 py-1.5 font-sans">hop {r.hop}</td>
                        {LEAVES.map((l) => (
                          <td key={l} className="px-3 py-1.5 text-right whitespace-nowrap">
                            {cell(r.aggs[l], 1)}{r.aggs[l] && <span className="text-zinc-500 text-[11px]"> · n={r.aggs[l].n}</span>}
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div className="px-3 py-2 text-[11px] text-zinc-500 font-sans">n = số cặp (chu kỳ telemetry, node) có cả latency lẫn hop.</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── Cây topology (SVG) ───────────────────────────────────────
    // Bố cục: mỗi node lá chiếm 1 cột, node cha đặt giữa các con; mỗi hop 1 hàng.
    const TREE_SLOT_W = 112, TREE_ROW_H = 96, TREE_BOX_W = 102, TREE_BOX_H = 66, TREE_PAD = 6, TREE_MAX_DEPTH = 8;

    function layoutTree(tree) {
      const nodes = [], edges = [];
      let nextSlot = 0;
      const walk = (t, depth) => {
        const n = { id: t.nodeId, depth, isRoot: depth === 0 };
        const kids = depth < TREE_MAX_DEPTH && Array.isArray(t.subs) ? t.subs.filter((s) => s && typeof s.nodeId === 'number') : [];
        const placed = kids.map((k) => walk(k, depth + 1));
        n.slot = placed.length ? (placed[0].slot + placed[placed.length - 1].slot) / 2 : nextSlot++;
        nodes.push(n);
        placed.forEach((c) => edges.push([n, c]));
        return n;
      };
      walk(tree, 0);
      return { nodes, edges, slots: nextSlot, depthMax: Math.max(...nodes.map((n) => n.depth)) };
    }

    function TopologyTree({ telemetry, nodeById, order }) {
      // Tên trong tooltip: Root giữ "Root", drone → "Drone N (ID …)"
      const nameOf = (n) => (n.isRoot ? `Root (ID ${n.id})` : `${droneLabel(n.id, order)} (ID ${n.id})`);
      if (!telemetry) return <div className="mono text-[12px] text-zinc-500 px-1">chưa có dữ liệu</div>;
      const tree = telemetry.tree;
      if (!tree || typeof tree.nodeId !== 'number') {
        return <div className="mono text-[12px] text-zinc-500 px-1">chưa có dữ liệu cây — Root chưa gửi "tree" (firmware Root cũ?)</div>;
      }

      const { nodes, edges, slots, depthMax } = layoutTree(tree);
      const inTree = new Set(nodes.map((n) => String(n.id)));
      // Node đã rời mesh nhưng Root còn giữ NSTAT (hop = null) — vẽ ở hàng riêng, không có cạnh
      const detached = (telemetry.nodes || []).filter((n) => !inTree.has(String(n.id)));
      const detRow = depthMax + 1;
      detached.forEach((n, i) => nodes.push({ id: n.id, depth: detRow, slot: i, detached: true }));

      const cols = Math.max(1, slots, detached.length);
      const rows = detached.length ? detRow + 1 : depthMax + 1;
      const W = cols * TREE_SLOT_W + TREE_PAD * 2;
      const H = rows * TREE_ROW_H - (TREE_ROW_H - TREE_BOX_H) + TREE_PAD * 2 + (detached.length ? 14 : 0);
      const cx = (n) => TREE_PAD + n.slot * TREE_SLOT_W + TREE_SLOT_W / 2;
      const top = (n) => TREE_PAD + n.depth * TREE_ROW_H + (n.detached ? 14 : 0);

      return (
        <div className="flex flex-col gap-1.5">
          <svg viewBox={`0 0 ${W} ${H}`} className="block mx-auto h-auto" style={{ width: '100%', maxWidth: W }}
               role="img" aria-label="Cây topology mesh">
            {edges.map(([p, c]) => {
              const info = nodeById[String(c.id)];
              const x1 = cx(p), y1 = top(p) + TREE_BOX_H, x2 = cx(c), y2 = top(c), ym = (y1 + y2) / 2;
              const d = `M${x1},${y1} C${x1},${ym} ${x2},${ym} ${x2},${y2}`;
              const lr = linkRssi(info);
              return (
                <g key={`${p.id}-${c.id}`}>
                  <path d={d} fill="none"
                        stroke={rssiColor(lr)} strokeWidth="2" strokeDasharray={Number.isFinite(lr) ? undefined : '4 3'}
                        opacity={nodeLost(info) ? 0.3 : 0.9} />
                  {/* Vùng rê chuột rộng hơn nét vẽ để dễ trỏ vào nhánh */}
                  <path d={d} fill="none" stroke="transparent" strokeWidth="12" style={{ pointerEvents: 'stroke' }}>
                    <title>{`${nameOf(p)} ↔ ${nameOf(c)}: ${Number.isFinite(lr) ? `${lr} dBm` : 'chưa có RSSI'}\n${linkSrcText(info)}`}</title>
                  </path>
                </g>
              );
            })}
            {detached.length > 0 && (
              <text x={TREE_PAD} y={top({ depth: detRow }) + 10} fontSize="10" fill="var(--text-3)">rời mesh (NSTAT gần đây)</text>
            )}
            {nodes.map((n) => {
              const info = n.isRoot ? null : nodeById[String(n.id)];
              const lost = !n.isRoot && nodeLost(info);
              const silent = !n.isRoot && !lost && info?.silent === true;   // còn trong mesh nhưng không gửi chunk
              const x = cx(n) - TREE_BOX_W / 2, y = top(n);
              const fw = n.isRoot ? telemetry.fw : info?.fw;
              const line2 = n.isRoot
                ? `ROOT · layer ${telemetry.layer ?? 0}`
                : `${Number.isFinite(linkRssi(info)) ? `${linkRssi(info)} dBm` : '— dBm'} · hop ${info?.hop ?? '—'}`;
              const line3 = lost ? ['mất tín hiệu', 'var(--critical)']
                : silent ? [`im lặng ${Number.isFinite(info.last_chunk_age_ms) ? `${Math.round(info.last_chunk_age_ms / 1000)}s` : ''}`, 'var(--critical)']
                : fw ? [`fw ${fw}`, 'var(--text-2)'] : ['firmware cũ?', 'var(--warning)'];
              const line4 = n.isRoot ? null
                : [`${rstText(info?.rst)} · up ${fmtUptime(info?.up_s)}`, RST_BAD.has(info?.rst) ? 'var(--warning)' : 'var(--text-3)'];
              const age = Number.isFinite(info?.age_ms) ? ` · NSTAT ${(info.age_ms / 1000).toFixed(1)}s trước` : '';
              const chunkAge = Number.isFinite(info?.last_chunk_age_ms) ? `\nChunk cuối: ${(info.last_chunk_age_ms / 1000).toFixed(1)}s trước${silent ? ' (IM LẶNG)' : ''}` : '';
              const rstTip = !n.isRoot && Number.isFinite(info?.rst) ? `\nReset: ${info.rst} (${RST_NAME[info.rst] || '?'}) · uptime ${fmtUptime(info.up_s)}` : '';
              const bigTip = !n.isRoot && Number.isFinite(info?.big) ? `\nFrame quá cỡ Leaf bỏ: ${info.big}` : '';
              return (
                <g key={`${n.detached ? 'd' : 't'}-${n.id}`} opacity={lost ? 0.4 : 1}>
                  <title>{`${nameOf(n)}${age}${n.isRoot ? '' : `\n${linkSrcText(info)}`}${chunkAge}${rstTip}${bigTip}`}</title>
                  <rect x={x} y={y} width={TREE_BOX_W} height={TREE_BOX_H} rx="6" fill="var(--surface-2)"
                        stroke={n.isRoot ? 'var(--accent)' : lost ? '#52525B' : silent ? 'var(--critical)' : rssiColor(linkRssi(info))}
                        strokeWidth={silent ? 2 : 1.2} strokeDasharray={silent ? '5 3' : undefined} />
                  <text x={x + 8} y={y + 16} fontSize="11" fontWeight="600" fill="var(--text)" className="mono">
                    {n.isRoot ? shortId(n.id) : droneLabel(n.id, order).toUpperCase()}
                    {!n.isRoot && <tspan fontSize="9" fontWeight="400" fill="var(--text-3)">{` ${shortId(n.id)}`}</tspan>}
                  </text>
                  <text x={x + 8} y={y + 31} fontSize="10" fill={n.isRoot ? 'var(--accent)' : rssiColor(linkRssi(info))} className="mono">{line2}</text>
                  <text x={x + 8} y={y + 45} fontSize="10" fill={line3[1]} className="mono">{line3[0]}</text>
                  {line4 && <text x={x + 8} y={y + 59} fontSize="9" fill={line4[1]} className="mono">{line4[0]}</text>}
                </g>
              );
            })}
          </svg>
          {edges.length === 0 && detached.length === 0 && (
            <div className="mono text-[12px] text-zinc-500 px-1">chưa có node nào tham gia mesh</div>
          )}
          <div className="flex flex-wrap gap-x-3 gap-y-1 text-[10px] text-zinc-400 mono px-1">
            <span className="inline-flex items-center gap-1"><span className="w-3 h-0.5" style={{ background: 'var(--good)' }}></span>&gt; {RSSI_GOOD}</span>
            <span className="inline-flex items-center gap-1"><span className="w-3 h-0.5" style={{ background: 'var(--warning)' }}></span>{RSSI_GOOD} … {RSSI_WEAK}</span>
            <span className="inline-flex items-center gap-1"><span className="w-3 h-0.5" style={{ background: 'var(--critical)' }}></span>&lt; {RSSI_WEAK} dBm</span>
            <span className="inline-flex items-center gap-1"><span className="w-3 border-t border-dashed" style={{ borderColor: 'var(--text-3)' }}></span>chưa có RSSI</span>
            <span className="inline-flex items-center gap-1"><span className="w-3 h-2.5 rounded-sm border border-dashed" style={{ borderColor: 'var(--critical)' }}></span>im lặng (trong mesh, &gt; 10 s không có chunk)</span>
          </div>
        </div>
      );
    }

    // Dòng RSSI · hop · fw cho ô camera. info = phần tử telemetry.nodes của node đó (có thể undefined).
    function NodeInfoLine({ info, compact }) {
      if (!info) return <span className="text-zinc-500">RSSI/hop/fw: chưa có dữ liệu</span>;
      const rssi = Number.isFinite(linkRssi(info)) ? `${linkRssi(info)} dBm` : '— dBm';
      return (
        <span>
          <span style={{ color: rssiColor(linkRssi(info)) }}>{rssi}</span>
          {!compact && <span> · hop {info.hop ?? '—'} · </span>}
          {!compact && (info.fw ? <span>fw {info.fw}</span> : <span style={{ color: 'var(--warning)' }}>firmware cũ?</span>)}
          {info.silent === true && <span style={{ color: 'var(--critical)' }}> · im lặng</span>}
          {info.big > 0 && <span style={{ color: 'var(--warning)' }}> · quá cỡ {info.big}</span>}
        </span>
      );
    }

    // ── Ô hiển thị một luồng camera ─────────────────────────────
    function FrameTile({ nodeId, f, latMs, info, order, big, onClick }) {
      const stale = Date.now() - f.ts > STALE_FRAME_MS;
      const goFull = (e) => {
        e.stopPropagation();
        const el = e.currentTarget.closest('[data-tile]');
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el && el.requestFullscreen) el.requestFullscreen();
      };
      return (
        <div data-tile onClick={onClick}
             className={`relative w-full h-full min-h-0 min-w-0 overflow-hidden rounded-md transition-shadow ${big ? '' : 'cursor-pointer hover:ring-1 hover:ring-white/20'}`}
             style={{ background: 'var(--surface-2)' }}>
          <img src={`data:image/jpeg;base64,${f.jpegBase64}`} alt={`Camera ${droneLabel(nodeId, order)} (ID ${nodeId})`}
               className={`w-full h-full object-contain ${stale ? 'opacity-20' : ''}`} />
          {stale && (
            <div className="absolute inset-0 opacity-95">
              <SignalEmpty small title="Mất tín hiệu" subtitle={big ? `ảnh cuối ${timeAgo(f.ts)} · frame #${f.frameId}` : timeAgo(f.ts)} />
            </div>
          )}
          <div className="absolute top-0 left-0 right-0 flex justify-between items-start p-1.5 pointer-events-none">
            <div className="flex flex-col items-start gap-0.5 min-w-0">
              <div className="mono bg-black/70 px-1.5 py-0.5 rounded leading-tight">
                <div className="text-[11px] font-medium text-zinc-100">{droneLabel(nodeId, order).toUpperCase()} · #{f.frameId}</div>
                <div className="text-[9px] text-zinc-500">ID {nodeId}</div>
              </div>
              <div className="mono text-[11px] bg-black/70 text-zinc-300 px-1.5 py-0.5 rounded truncate max-w-full">
                <NodeInfoLine info={info} compact={!big} />
              </div>
            </div>
            {big && <StatusBadge state={stale ? 'stale' : 'ok'} label={stale ? 'mất tín hiệu' : 'live'} className="!bg-black/70" />}
          </div>
          <div className="absolute bottom-0 left-0 right-0 flex justify-between items-end p-1.5">
            <div className="mono text-[11px] bg-black/70 text-zinc-300 px-1.5 py-0.5 rounded pointer-events-none truncate">
              {f.fps > 0 ? `${f.fps.toFixed(1)} fps` : '— fps'} · {(f.bytes / 1024).toFixed(1)} KB · {latMs != null ? `lat ${latMs.toFixed(0)} ms` : 'lat: chưa có dữ liệu'} · {timeAgo(f.ts)}
            </div>
            <button onClick={goFull} title="Toàn màn hình"
                    className="mono text-[11px] bg-black/70 text-zinc-300 hover:text-white px-1.5 py-0.5 rounded">
              ⛶
            </button>
          </div>
        </div>
      );
    }

    function MeshDashboard() {
      // ── Kết nối tới middleware ──────────────────────────────
      const [socketConnected, setSocketConnected] = useState(false);
      const [serialConnected, setSerialConnected] = useState(false);
      const [serialInfo, setSerialInfo] = useState(null);

      // ── Dữ liệu thật nhận qua Socket.IO ──────────────────────
      const [telemetry, setTelemetry] = useState(null);       // UART_PROTOCOL.md §4.2
      const [telemetryAt, setTelemetryAt] = useState(null);
      const [frameByNode, setFrameByNode] = useState({});     // nodeId -> { jpegBase64, frameId, ts, bytes, fps }
      const [frameCount, setFrameCount] = useState(0);
      const [fps, setFps] = useState(0);
      const [logs, setLogs] = useState([
        { time: new Date().toLocaleTimeString('vi-VN'), msg: HAS_IO ? 'Dashboard khởi động, đang chờ middleware...' : 'Chế độ xem trước (file://): không có Socket.IO, không nhận dữ liệu.' },
      ]);

      // ── Giao diện ───────────────────────────────────────────
      const [tab, setTab] = useState('live');
      const [viewMode, setViewMode] = useState('grid');       // 'grid' | 'focus'
      const [focusId, setFocusId] = useState(null);
      const [, setTick] = useState(0);

      // ── Số liệu so sánh 1/2/3 leaf ───────────────────────────
      const [compare, setCompare] = useState(loadStore);
      const [recording, setRecordingState] = useState(true);
      const recordingRef = useRef(true);
      const setRecording = (v) => { recordingRef.current = v; setRecordingState(v); };

      // ── Số thứ tự drone (meshDashDroneOrder.v1, tách khỏi số liệu so sánh) ──
      const [droneOrder, setDroneOrder] = useState(loadDroneOrder);
      const rootIdRef = useRef(null);            // Root ID học từ telemetry.tree.nodeId
      useEffect(() => { saveDroneOrder(droneOrder); }, [droneOrder]);

      const frameTimesRef = useRef([]);          // ước lượng FPS tổng
      const nodeTimesRef = useRef({});           // ước lượng FPS từng node
      const lastSelfHealRef = useRef(undefined);  // chỉ log khi self-heal THAY ĐỔI
      const seenHealRef = useRef(new Set());      // "id:ts" các heal_events đã nhận (middleware gửi lại telemetry cuối khi nối lại)
      const lastRootTsRef = useRef(null);         // "ts" telemetry trước — giảm = Root khởi động lại
      const [lastHeal, setLastHeal] = useState(null);  // heal_events gần nhất
      const prevTelRef = useRef(null);           // telemetry trước đó để tính tốc độ
      const bytesAccRef = useRef(0);             // byte JPEG nhận được giữa hai telemetry
      const framesAccRef = useRef(0);

      // Lịch sử ngắn (HIST_MAX điểm) cho sparkline + khoảng min/max trong phiên
      const histRef = useRef({ fps: [], drop: [], heap: [], lat: [] });
      const rangeRef = useRef({ heap: null, psram: null, fpsMax: 0 });
      const pushHist = (key, v) => {
        if (!Number.isFinite(v)) return;
        const a = histRef.current[key];
        a.push(v);
        if (a.length > HIST_MAX) a.shift();
      };
      const extendRange = (key, v) => {
        const r = rangeRef.current[key];
        rangeRef.current[key] = r ? [Math.min(r[0], v), Math.max(r[1], v)] : [v, v];
      };

      const addLog = (msg) => {
        setLogs((prev) => [{ time: new Date().toLocaleTimeString('vi-VN'), msg }, ...prev].slice(0, 50));
      };

      // Trang đang mở có phải bản cũ không? Socket.IO tự nối lại khi middleware khởi động lại,
      // nên tab cũ vẫn chạy JS cũ (vd CSV thiếu cột mới) dù file trên đĩa đã đổi. So Last-Modified
      // của chính trang lúc mở với hiện tại, lệch → hiện banner nhắc tải lại.
      const [pageOutdated, setPageOutdated] = useState(false);
      useEffect(() => {
        if (!HAS_IO) return;
        let base = null;
        const check = () => fetch(window.location.pathname, { method: 'HEAD', cache: 'no-store' })
          .then((r) => {
            const lm = r.headers.get('last-modified');
            if (!lm) return;
            if (base == null) base = lm;
            else if (lm !== base) setPageOutdated(true);
          })
          .catch(() => { /* middleware tạm tắt — thử lại lần sau */ });
        check();
        const id = setInterval(check, 15000);
        return () => clearInterval(id);
      }, []);

      useEffect(() => { saveStore(compare); }, [compare]);
      useEffect(() => {
        const id = setInterval(() => setTick((n) => n + 1), 1000);
        return () => clearInterval(id);
      }, []);

      useEffect(() => {
        // Mở file trực tiếp (file://) thì /socket.io/socket.io.js không tải được -> io không tồn tại.
        // Trả về sớm để giao diện vẫn render ở trạng thái "disconnected" thay vì trang trắng.
        if (typeof io === 'undefined') {
          console.warn('[Dashboard] Không tìm thấy Socket.IO client. Hãy chạy `node server.js COMx` rồi mở http://localhost:3000/ để nhận dữ liệu thật.');
          return;
        }
        const socket = io();

        socket.on('connect', () => {
          setSocketConnected(true);
          addLog('Đã kết nối tới middleware (Socket.IO).');
        });
        socket.on('disconnect', () => {
          setSocketConnected(false);
          setSerialConnected(false);
          prevTelRef.current = null;
          addLog('Mất kết nối tới middleware!');
        });
        socket.on('status', (s) => {
          setSerialConnected(!!s.serialConnected);
          setSerialInfo({ portName: s.portName, baudRate: s.baudRate });
          addLog(s.serialConnected
            ? `Middleware đã mở cổng ${s.portName} @ ${s.baudRate} bps`
            : `Middleware CHƯA mở được cổng ${s.portName} — kiểm tra board đã cắm & đúng COM chưa`);
        });

        socket.on('telemetry', (t) => {
          const now = Date.now();
          setTelemetry(t);
          setTelemetryAt(now);
          setSerialConnected(true);

          // Đánh số drone mới theo thứ tự node_ids (Root bỏ qua)
          if (typeof t.tree?.nodeId === 'number') rootIdRef.current = t.tree.nodeId;
          setDroneOrder((m) => assignDroneNumbers(m, t.node_ids, [rootIdRef.current]));

          const leaf = typeof t.node_count === 'number' ? t.node_count : (Array.isArray(t.node_ids) ? t.node_ids.length : null);

          // Self-healing: chỉ log/ghi khi giá trị thay đổi thật
          if (typeof t.last_self_heal_ms === 'number' && t.last_self_heal_ms >= 0 &&
              t.last_self_heal_ms !== lastSelfHealRef.current) {
            if (lastSelfHealRef.current !== undefined) {
              addLog(`SELF-HEALING: mesh khôi phục kết nối sau ${t.last_self_heal_ms} ms.`);
              if (recordingRef.current && LEAVES.includes(leaf)) {
                setCompare((st) => addHeal(st, leaf, t.last_self_heal_ms, now));
              }
            }
            lastSelfHealRef.current = t.last_self_heal_ms;
          }

          // Self-healing theo luồng dữ liệu: Root gửi mỗi sự kiện đúng 1 lần; lọc trùng thêm theo "id:ts"
          // phòng middleware gửi lại telemetry cuối khi dashboard nối lại. Root reset (ts giảm) → ts lặp lại được.
          if (typeof t.ts === 'number') {
            if (lastRootTsRef.current != null && t.ts < lastRootTsRef.current) seenHealRef.current.clear();
            lastRootTsRef.current = t.ts;
          }
          (Array.isArray(t.heal_events) ? t.heal_events : []).forEach((ev) => {
            if (!ev || !Number.isFinite(ev.ms) || ev.ms < 0) return;
            const key = `${ev.id}:${ev.ts}`;
            if (seenHealRef.current.has(key)) return;
            seenHealRef.current.add(key);
            setLastHeal(ev);
            addLog(`SELF-HEALING (luồng dữ liệu): node ${shortId(ev.id)} có chunk lại sau ${ev.ms} ms (mốc: ${HEAL_SRC_TEXT[ev.start_src] || ev.start_src}).`);
            if (recordingRef.current && LEAVES.includes(leaf)) {
              setCompare((st) => addHealNew(st, leaf, ev, now));
            }
          });

          // Mẫu đo cho tab so sánh
          const prev = prevTelRef.current;
          const bytes = bytesAccRef.current, nFrames = framesAccRef.current;
          bytesAccRef.current = 0;
          framesAccRef.current = 0;
          prevTelRef.current = { t, at: now, leaf };

          // Lịch sử cho sparkline / thanh tiến trình (luôn ghi, không phụ thuộc nút "Đang ghi")
          if (typeof t.heap_def === 'number') { pushHist('heap', t.heap_def / 1024); extendRange('heap', t.heap_def); }
          if (typeof t.psram_free === 'number') extendRange('psram', t.psram_free);
          if (t.lat_n > 0) pushHist('lat', t.lat_avg_ms);
          if (prev) {
            const dtw = (now - prev.at) / 1000;
            if (dtw > 0.3 && dtw < 10) {
              pushHist('fps', nFrames / dtw);
              const dOk0 = t.frames_ok - prev.t.frames_ok, dDrop0 = t.frames_drop - prev.t.frames_drop;
              if (dOk0 >= 0 && dDrop0 >= 0 && dOk0 + dDrop0 > 0) pushHist('drop', (100 * dDrop0) / (dOk0 + dDrop0));
            }
          }

          if (!prev || !recordingRef.current) return;
          if (prev.leaf !== leaf || !LEAVES.includes(leaf)) return;   // đang chuyển cấu hình

          const dtWall = (now - prev.at) / 1000;
          const dtRoot = typeof t.ts === 'number' && typeof prev.t.ts === 'number' ? (t.ts - prev.t.ts) / 1000 : dtWall;
          if (dtWall < 0.3 || dtWall > 10 || dtRoot <= 0 || Math.abs(dtRoot - dtWall) > 1.5) return; // telemetry cũ / Root reset

          const dOk = t.frames_ok - prev.t.frames_ok;
          const dDrop = t.frames_drop - prev.t.frames_drop;
          const dCh = t.chunks - prev.t.chunks;
          if ([dOk, dDrop, dCh].some((d) => !Number.isFinite(d) || d < 0)) return; // bộ đếm bị reset

          const s = { t: now, leaf, fps: dOk / dtRoot, fpsPerNode: dOk / dtRoot / leaf, kbps: bytes / 1024 / dtWall, chunksPs: dCh / dtRoot };
          if (dOk + dDrop > 0) s.dropPct = (100 * dDrop) / (dOk + dDrop);
          if (nFrames > 0) s.frameKB = bytes / 1024 / nFrames;
          if (typeof t.heap_def === 'number') s.heapDefKB = t.heap_def / 1024;
          const heapInt = t.heap_int ?? t.heap_free;   // FW < 2026-10-01b gửi "heap_free" (cùng phép đo)
          if (typeof heapInt === 'number') s.heapIntKB = heapInt / 1024;
          if (typeof t.uart_drop === 'number') s.uartDrop = t.uart_drop;
          if (typeof t.uart_defer === 'number') s.uartDefer = t.uart_defer;
          if (typeof t.log_drop === 'number') s.logDrop = t.log_drop;
          if (typeof t.late_chunk_drop === 'number') s.lateChunkDrop = t.late_chunk_drop;
          if (typeof t.loop_max_ms === 'number') s.loopMaxMs = t.loop_max_ms;
          const heapDefMin = t.heap_def_min_win ?? t.heap_min_win, heapIntMinBoot = t.heap_int_min_boot ?? t.heap_min_boot;
          if (typeof heapDefMin === 'number') s.heapDefMinWinKB = heapDefMin / 1024;
          if (typeof heapIntMinBoot === 'number') s.heapIntMinBootKB = heapIntMinBoot / 1024;
          if (typeof t.heap_def_largest === 'number') s.heapDefLargestKB = t.heap_def_largest / 1024;
          if (typeof t.frame_max_bytes_win === 'number') s.frameMaxBytesWin = t.frame_max_bytes_win;
          if (typeof t.frame_max_bytes_boot === 'number') s.frameMaxBytesBoot = t.frame_max_bytes_boot;
          if (typeof t.fw === 'string') s.fwRoot = t.fw;
          if (t.lat_n > 0 && Number.isFinite(t.lat_avg_ms)) {
            s.latMs = t.lat_avg_ms; s.latMinMs = t.lat_min_ms; s.latMaxMs = t.lat_max_ms; s.latN = t.lat_n;
          }
          // Topology cho CSV: chỉ node còn trong cây và NSTAT còn mới; không có thì để trống
          const live = Array.isArray(t.nodes) ? t.nodes.filter((n) => n && !nodeLost(n)) : [];
          const hops = live.filter((n) => Number.isFinite(n.hop));
          const rssis = live.filter((n) => Number.isFinite(linkRssi(n)));
          if (hops.length) { s.hopMax = Math.max(...hops.map((n) => n.hop)); s.hopByNode = hops.map((n) => `${n.id}:${n.hop}`).join(';'); }
          if (t.lat_by_node && typeof t.lat_by_node === 'object') {
            const lat = Object.entries(t.lat_by_node).filter(([, v]) => Number.isFinite(v));
            if (lat.length) s.latByNode = lat.map(([id, v]) => `${id}:${v.toFixed(1)}`).join(';');
          }
          if (rssis.length) { s.rssiMin = Math.min(...rssis.map(linkRssi)); s.rssiByNode = rssis.map((n) => `${n.id}:${linkRssi(n)}`).join(';'); }
          const bigs = live.filter((n) => Number.isFinite(n.big));
          if (bigs.length) s.bigByNode = bigs.map((n) => `${n.id}:${n.big}`).join(';');
          const withFw = live.filter((n) => typeof n.fw === 'string' && n.fw);
          s.nLeaf = withFw.length;
          if (withFw.length) s.fwLeaf = withFw.map((n) => `${n.id}:${n.fw}`).join(';');
          const stg = [...new Set(live.filter((n) => n.stg === 0 || n.stg === 1).map((n) => n.stg))];
          if (stg.length) s.stagger = stg.length > 1 ? 'mix' : String(stg[0]);
          setCompare((st) => addSample(st, s));
        });

        socket.on('frame', (data) => {
          const now = Date.now();
          const b64 = data.jpegBase64 || '';
          const bytes = Math.floor((b64.length * 3) / 4) - (b64.endsWith('==') ? 2 : b64.endsWith('=') ? 1 : 0);
          bytesAccRef.current += bytes;
          framesAccRef.current += 1;

          const nt = (nodeTimesRef.current[data.nodeId] ||= []);
          nt.push(now);
          while (nt.length > 10) nt.shift();
          const nodeFps = nt.length >= 2 ? (1000 * (nt.length - 1)) / (nt[nt.length - 1] - nt[0] || 1) : 0;

          setDroneOrder((m) => assignDroneNumbers(m, [data.nodeId], [rootIdRef.current]));
          setFrameCount((prev) => prev + 1);
          setFrameByNode((prev) => ({
            ...prev,
            [data.nodeId]: { jpegBase64: b64, frameId: data.frameId, ts: now, bytes, fps: nodeFps },
          }));

          const times = frameTimesRef.current;
          times.push(now);
          while (times.length > 10) times.shift();
          if (times.length >= 2) {
            const avgIntervalMs = (times[times.length - 1] - times[0]) / (times.length - 1);
            if (avgIntervalMs > 0) {
              const f = 1000 / avgIntervalMs;
              setFps(f);
              rangeRef.current.fpsMax = Math.max(rangeRef.current.fpsMax, f);
            }
          }
        });

        return () => socket.disconnect();
      }, []);

      const resetCompare = () => {
        if (!window.confirm('Xoá toàn bộ số liệu so sánh đã ghi?')) return;
        prevTelRef.current = null;
        setCompare(emptyStore());
      };

      const now = Date.now();
      const nodeIds = telemetry?.node_ids || [];
      const telFresh = socketConnected && telemetryAt != null && now - telemetryAt <= STALE_TELEMETRY_MS;

      // "Đánh số lại": xoá bảng, đánh lại từ 1 theo node_ids đang online (telemetry còn mới).
      // Không đụng số liệu so sánh (STORE_KEY).
      const renumberDrones = () => {
        if (!window.confirm('Xoá bảng số thứ tự drone và đánh số lại từ 1 theo các drone đang online?')) return;
        const online = telFresh && Array.isArray(telemetry?.node_ids) ? telemetry.node_ids : [];
        setDroneOrder(assignDroneNumbers({}, online, [rootIdRef.current]));
        addLog(`Đánh số lại drone: ${online.length} drone đang online.`);
      };
      // Trạng thái từng node (NSTAT do Root gom, UART_PROTOCOL.md §4.2 "nodes"), tra theo id dạng chuỗi
      const nodeById = {};
      (Array.isArray(telemetry?.nodes) ? telemetry.nodes : []).forEach((n) => { if (n && n.id != null) nodeById[String(n.id)] = n; });
      const leafCount = telemetry ? (typeof telemetry.node_count === 'number' ? telemetry.node_count : nodeIds.length) : null;
      // Card Media stream theo số drone tăng dần; chưa có số ("Drone ?") xếp cuối, rồi theo node ID
      const droneNo = (id) => (Number.isFinite(droneOrder[id]) ? droneOrder[id] : Infinity);
      const frames = Object.entries(frameByNode).sort(([a], [b]) => droneNo(a) - droneNo(b) || Number(a) - Number(b));
      const focusEntry = frames.find(([id]) => id === focusId) || frames[0];

      // FPS hiển thị: về 0 khi quá STALE_FRAME_MS không có frame mới (đo thật, không giữ số cũ)
      const lastFrameAt = frameTimesRef.current[frameTimesRef.current.length - 1];
      const displayFps = lastFrameAt == null ? null : (now - lastFrameAt > STALE_FRAME_MS ? 0 : fps);

      const dropPctTotal = telemetry && (telemetry.frames_ok + telemetry.frames_drop) > 0
        ? (100 * telemetry.frames_drop) / (telemetry.frames_ok + telemetry.frames_drop) : null;
      // Latency: chỉ hiển thị khi chu kỳ telemetry gần nhất có mẫu thật (lat_n > 0)
      const latHas = !!telemetry && telemetry.lat_n > 0 && Number.isFinite(telemetry.lat_avg_ms);
      const latOf = (id) => {
        const v = telemetry?.lat_by_node?.[id];
        return Number.isFinite(v) ? v : null;
      };
      const selfHeal = telemetry && typeof telemetry.last_self_heal_ms === 'number' && telemetry.last_self_heal_ms >= 0
        ? `${telemetry.last_self_heal_ms} ms` : (telemetry ? 'chưa xảy ra' : null);
      const selfHealNew = lastHeal ? `${lastHeal.ms} ms · ${droneLabel(lastHeal.id, droneOrder)} (${lastHeal.start_src})`
        : (telemetry && 'heal_events' in telemetry ? 'chưa xảy ra' : null);

      // Trạng thái kết nối (luôn kèm chữ, không chỉ dựa vào màu)
      const telAge = telemetryAt ? now - telemetryAt : null;
      const mwBadge = socketConnected
        ? { state: 'ok', label: 'connected' }
        : { state: 'bad', label: HAS_IO ? 'disconnected' : 'disconnected (xem trước)' };
      const rootBadge = !socketConnected ? { state: 'bad', label: 'chưa nhận' }
        : telAge != null && telAge <= STALE_TELEMETRY_MS ? { state: 'ok', label: 'đang nhận' }
        : telAge != null ? { state: 'stale', label: `dữ liệu cũ · ${timeAgo(telemetryAt)}` }
        : { state: 'bad', label: serialConnected ? 'cổng mở, chưa có telemetry' : 'chưa nhận' };

      // Thanh tiến trình: dùng tổng thật nếu đã điền hằng số, không thì theo min/max trong phiên
      const memBar = (free, total, range) => {
        if (free == null) return { frac: null, note: null };
        if (total) return { frac: free / total, note: `${((100 * free) / total).toFixed(0)}% trống / tổng ${kb(total)}` };
        if (!range) return { frac: null, note: null };
        const [lo, hi] = range;
        return { frac: hi > lo ? (free - lo) / (hi - lo) : 1, note: `theo phiên · ${kb(lo)} – ${kb(hi)}` };
      };
      const heapBar = memBar(telemetry?.heap_def ?? null, HEAP_TOTAL_BYTES, rangeRef.current.heap);
      const heapIntNow = telemetry?.heap_int ?? telemetry?.heap_free ?? null;
      const heapDefMinWin = telemetry?.heap_def_min_win ?? telemetry?.heap_min_win ?? null;
      const heapDefLargest = telemetry?.heap_def_largest ?? null;
      const heapDefCls = (v) => (v < HEAP_DEF_CRITICAL_BYTES ? 'text-red-400' : v < 2 * HEAP_DEF_CRITICAL_BYTES ? 'text-yellow-300' : 'text-zinc-50');
      const psramBar = memBar(telemetry?.psram_free ?? null, PSRAM_TOTAL_BYTES, rangeRef.current.psram);
      const fpsMax = rangeRef.current.fpsMax;
      const fpsBar = displayFps == null ? { frac: null, note: null }
        : FPS_TARGET ? { frac: displayFps / FPS_TARGET, note: `mục tiêu ${FPS_TARGET} fps` }
        : { frac: fpsMax > 0 ? displayFps / fpsMax : null, note: fpsMax > 0 ? `theo phiên · max ${fpsMax.toFixed(1)} fps` : null };

      // Dòng mô tả trạng thái thật cho empty state
      const emptySubtitle = !HAS_IO ? 'Chế độ xem trước: không có Socket.IO nên không nhận được frame.'
        : !socketConnected ? 'Chưa kết nối tới middleware (server.js).'
        : !telemetry && !serialConnected ? 'Đã kết nối middleware, nhưng middleware chưa mở được cổng UART tới Root Node.'
        : !telemetry ? 'Đã kết nối middleware, đang chờ Root Node gửi dữ liệu qua UART.'
        : leafCount === 0 ? 'Root Node đang gửi telemetry nhưng chưa có node nào tham gia mesh.'
        : `Mesh có ${leafCount} node nhưng chưa nhận được frame ảnh nào.`;

      const gridCols = frames.length <= 1 ? 'grid-cols-1' : 'grid-cols-1 md:grid-cols-2';
      const gridRows = frames.length <= 2 ? 'lg:grid-rows-1' : 'lg:grid-rows-2';

      return (
        <div className="min-h-screen lg:h-screen flex flex-col" style={{ background: 'var(--bg)' }}>
          {/* Banner chế độ xem trước (file://) */}
          {!HAS_IO && (
            <div className="shrink-0 px-4 py-2 text-[12px] text-center" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>
              Đang xem ở chế độ xem trước. Mở{' '}
              <a href="http://localhost:3000/" className="mono underline underline-offset-2 hover:text-white">http://localhost:3000/</a>{' '}
              để nhận dữ liệu thật
            </div>
          )}

          {pageOutdated && (
            <div className="shrink-0 px-4 py-2 text-[12px] text-center flex flex-wrap justify-center items-center gap-2"
                 style={{ background: 'rgba(250, 204, 21, .12)', color: 'var(--warning)' }}>
              File dashboard trên máy đã được cập nhật sau khi mở trang này — trang đang chạy mã cũ (CSV/biểu đồ có thể thiếu cột mới).
              <button onClick={() => window.location.reload()} className="btn mono !py-0.5">Tải lại trang</button>
            </div>
          )}

          {/* HEADER */}
          <header className="shrink-0 min-h-[52px] flex flex-wrap items-center gap-x-4 gap-y-2 px-3 sm:px-4 py-2"
                  style={{ background: 'var(--surface-1)', boxShadow: 'var(--shadow)' }}>
            <h1 className="text-[15px] font-semibold text-zinc-50 whitespace-nowrap">Dashboard Mesh Drone</h1>
            <nav className="seg">
              {[['live', 'Live'], ['compare', 'Bảng so sánh']].map(([id, label]) => (
                <button key={id} onClick={() => setTab(id)} aria-pressed={tab === id}>{label}</button>
              ))}
            </nav>
            <div className="ml-auto flex flex-wrap items-center gap-2">
              <span className="hidden md:inline label">Middleware</span>
              <StatusBadge {...mwBadge} />
              <span className="hidden md:inline label ml-2">Root UART</span>
              <StatusBadge {...rootBadge} />
              {/* Chỉ hiện số khi telemetry còn mới (middleware + Root đang nhận); không thì xám, không số */}
              <span className="mono text-[12px] font-semibold px-2.5 py-0.5 rounded-full ml-1 whitespace-nowrap"
                    style={telFresh && leafCount != null
                      ? { background: 'var(--accent-soft)', color: 'var(--accent)' }
                      : { background: 'rgba(255, 255, 255, .06)', color: 'var(--text-3)' }}>
                Tổng {telFresh && leafCount != null ? leafCount : '–'} Drone
              </span>
            </div>
          </header>

          {tab === 'compare' ? (
            <div className="flex-1 overflow-y-auto">
              <CompareTab store={compare} recording={recording} setRecording={setRecording}
                          onReset={resetCompare} currentLeaf={leafCount} />
            </div>
          ) : (
            <div className="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-[340px_minmax(0,1fr)] gap-3 p-3">

              {/* LEFT: THÔNG SỐ */}
              <aside className="flex flex-col gap-3 min-h-0 min-w-0 lg:overflow-y-auto lg:pr-1">
                <section className="panel p-3 flex flex-col gap-1.5">
                  <div className="flex justify-between items-center mb-1">
                    <span className="panel-h">Kết nối</span>
                    <button onClick={renumberDrones} className="btn mono !px-2 !py-0.5 !text-[11px]"
                            title="Xoá bảng số thứ tự drone, đánh lại từ 1 theo các drone đang online">Đánh số lại</button>
                  </div>
                  <Row k="Middleware" badge={<StatusBadge {...mwBadge} />} />
                  <Row k="Root UART" badge={<StatusBadge {...rootBadge} />} />
                  <Row k="Cổng" v={serialInfo ? `${serialInfo.portName} @ ${serialInfo.baudRate}` : null} />
                  <Row k="Telemetry" v={telemetryAt ? timeAgo(telemetryAt) : null} cls={telAge > STALE_TELEMETRY_MS ? 'text-yellow-300' : 'text-zinc-50'} />
                </section>

                <section className="panel p-3 flex flex-col gap-1.5">
                  <div className="panel-h mb-1">Telemetry · Root Node</div>
                  <div className="grid grid-cols-2 gap-1.5">
                    <div className="nested px-2.5 py-2">
                      <div className="label">Drone</div>
                      {leafCount != null
                        ? <div className="mono text-[20px] font-semibold" style={{ color: 'var(--accent)' }}>{leafCount}</div>
                        : <div className="text-[12px] text-zinc-500 leading-7">chưa có dữ liệu</div>}
                    </div>
                    <div className="nested px-2.5 py-2">
                      <div className="label">Layer</div>
                      {telemetry?.layer != null
                        ? <div className="mono text-[20px] font-semibold text-zinc-50">{telemetry.layer}</div>
                        : <div className="text-[12px] text-zinc-500 leading-7">chưa có dữ liệu</div>}
                    </div>
                  </div>
                  <MetricCard label="FPS đo tại dashboard" value={displayFps != null ? displayFps.toFixed(1) : null} unit="fps"
                              valueColor="var(--accent)" spark={histRef.current.fps} sparkColor="var(--accent)"
                              bar={fpsBar.frac} barColor="var(--accent)" note={fpsBar.note} />
                  <MetricCard label="Tỉ lệ hủy (tích luỹ)" value={dropPctTotal != null ? dropPctTotal.toFixed(1) : null} unit="%"
                              valueColor={dropColor(dropPctTotal)} spark={histRef.current.drop} sparkColor={dropColor(dropPctTotal)}
                              bar={dropPctTotal != null ? dropPctTotal / 100 : null} barColor={dropColor(dropPctTotal)}
                              note={dropPctTotal != null ? 'thang 0–100% · sparkline: tỉ lệ từng chu kỳ telemetry' : null} />
                  <MetricCard label="Latency (chụp → ghép xong)" value={latHas ? telemetry.lat_avg_ms.toFixed(1) : null} unit="ms"
                              spark={histRef.current.lat} sparkColor="var(--accent)"
                              note={latHas ? `min ${fmt(telemetry.lat_min_ms, 1)} · max ${fmt(telemetry.lat_max_ms, 1)} ms · ${telemetry.lat_n} frame / chu kỳ` : null} />
                  <MetricCard label="Heap DEFAULT trống (heap malloc dùng được)" value={telemetry?.heap_def != null ? Math.round(telemetry.heap_def / 1024) : null} unit="KB"
                              spark={histRef.current.heap} sparkColor="#A1A1AA" bar={heapBar.frac} barColor="var(--accent)"
                              note={[heapBar.note, heapIntNow != null ? `INTERNAL (gồm IRAM) ${Math.round(heapIntNow / 1024)} KB` : null].filter(Boolean).join(' · ') || null} />
                  <MetricCard label="PSRAM trống" value={telemetry?.psram_free != null ? Math.round(telemetry.psram_free / 1024) : null} unit="KB"
                              bar={psramBar.frac} barColor="var(--accent)" note={psramBar.note} />
                  <Row k="Frame ghép OK" v={telemetry?.frames_ok} cls="text-emerald-400" />
                  <Row k="Frame bị hủy" v={telemetry?.frames_drop} cls="text-red-400" />
                  <Row k="Chunk trễ bị bỏ" v={telemetry?.late_chunk_drop} cls={telemetry?.late_chunk_drop > 0 ? 'text-yellow-300' : 'text-zinc-50'} />
                  <Row k="Chunk đã nhận" v={telemetry?.chunks} />
                  <Row k="Ảnh bỏ ở UART (TX đầy)" v={telemetry?.uart_drop} cls={telemetry?.uart_drop > 0 ? 'text-yellow-300' : 'text-zinc-50'} />
                  {/* Đo đạc ổn định Root (FW ≥ 2026-10-01a): cửa sổ = 1 chu kỳ telemetry. Firmware cũ không gửi → — */}
                  <div className="grid grid-cols-2 gap-1.5">
                    {[
                      ['Loop max', telemetry?.loop_max_ms, 'ms', telemetry?.loop_max_ms >= 1000 ? 'text-red-400' : telemetry?.loop_max_ms >= 200 ? 'text-yellow-300' : 'text-zinc-50'],
                      ['DEFAULT min cửa sổ', heapDefMinWin != null ? Math.round(heapDefMinWin / 1024) : null, 'KB', heapDefCls(heapDefMinWin)],
                      ['DEFAULT khối lớn nhất', heapDefLargest != null ? Math.round(heapDefLargest / 1024) : null, 'KB', heapDefCls(heapDefLargest)],
                      ['UART hoãn', telemetry?.uart_defer, '', telemetry?.uart_defer > 0 ? 'text-yellow-300' : 'text-zinc-50'],
                    ].map(([label, v, unit, cls]) => (
                      <div key={label} className="nested px-2.5 py-2">
                        <div className="label">{label}</div>
                        <div className={`mono text-[15px] font-semibold ${v != null ? cls : 'text-zinc-500'}`}>
                          {v != null ? v : '—'}{v != null && unit ? <span className="text-[11px] text-zinc-500"> {unit}</span> : null}
                        </div>
                      </div>
                    ))}
                  </div>
                  <Row k="Self-healing (luồng) gần nhất" v={selfHealNew} cls="text-yellow-300" />
                  <Row k="Self-healing (cách cũ)" v={selfHeal} cls="text-zinc-400" />
                  <Row k="Node im lặng (số lần)" v={telemetry?.silent_events} cls={telemetry?.silent_events > 0 ? 'text-red-400' : 'text-zinc-50'} />
                </section>

                <section className="panel p-3 flex flex-col gap-1.5">
                  <div className="flex justify-between items-center mb-1">
                    <span className="panel-h">Topology</span>
                    <StatusBadge {...rootBadge} />
                  </div>
                  <TopologyTree telemetry={telemetry} nodeById={nodeById} order={droneOrder} />
                </section>

                <section className="panel flex flex-col min-h-[180px] lg:flex-1">
                  <div className="panel-h px-3 pt-3 pb-2">Log</div>
                  <div className="nested mx-3 mb-3 p-2.5 flex-1 overflow-y-auto mono text-[11px] leading-[1.55] space-y-1 max-h-64 lg:max-h-none">
                    {logs.map((log, i) => (
                      <div key={i} className="flex gap-2">
                        <span className="text-zinc-500 shrink-0">{log.time}</span>
                        <span className={
                          log.msg.includes('Mất kết nối') ? 'text-red-400' :
                          log.msg.includes('SELF-HEALING') ? 'text-emerald-400' :
                          log.msg.includes('CHƯA') ? 'text-yellow-300' : 'text-zinc-300'
                        }>{log.msg}</span>
                      </div>
                    ))}
                  </div>
                </section>
              </aside>

              {/* RIGHT: MEDIA STREAM */}
              <main className="panel flex flex-col min-h-[60vh] lg:min-h-0 min-w-0 overflow-hidden">
                <div className="shrink-0 flex flex-wrap items-center gap-x-3 gap-y-2 px-3 py-2.5">
                  <span className="panel-h">Media stream</span>
                  <span className="mono text-[11px] text-zinc-500">MJPEG qua UART</span>
                  <div className="seg ml-1">
                    {[['grid', 'Lưới'], ['focus', 'Tập trung']].map(([id, label]) => (
                      <button key={id} onClick={() => setViewMode(id)} aria-pressed={viewMode === id}>{label}</button>
                    ))}
                  </div>
                  <span className="ml-auto mono text-[11px] text-zinc-400">
                    <span className="font-semibold" style={{ color: 'var(--accent)' }}>{displayFps != null ? `${displayFps.toFixed(1)} fps` : '— fps'}</span>
                    {' '}· {frames.length} luồng · tổng {frameCount} frame
                  </span>
                </div>

                <div className="flex-1 min-h-0 px-3 pb-3">
                  {frames.length === 0 ? (
                    <div className="h-full min-h-[50vh]">
                      <SignalEmpty title="Đang chờ tín hiệu video" subtitle={emptySubtitle} />
                    </div>
                  ) : viewMode === 'grid' ? (
                    <div className={`h-full grid ${gridCols} ${gridRows} gap-2 auto-rows-[minmax(240px,1fr)] lg:auto-rows-auto`}>
                      {frames.map(([id, f]) => (
                        <FrameTile key={id} nodeId={id} f={f} latMs={latOf(id)} info={nodeById[id]} order={droneOrder} big onClick={() => { setFocusId(id); setViewMode('focus'); }} />
                      ))}
                    </div>
                  ) : (
                    <div className="h-full flex flex-col gap-2">
                      <div className="flex-1 min-h-[45vh] lg:min-h-0 flex">
                        <div className="flex-1 min-w-0 flex">
                          <FrameTile nodeId={focusEntry[0]} f={focusEntry[1]} latMs={latOf(focusEntry[0])} info={nodeById[focusEntry[0]]} order={droneOrder} big />
                        </div>
                      </div>
                      {frames.length > 1 && (
                        <div className="h-24 shrink-0 flex gap-2 overflow-x-auto">
                          {frames.map(([id, f]) => (
                            <div key={id} className="w-40 shrink-0 flex rounded-md"
                                 style={id === focusEntry[0] ? { boxShadow: '0 0 0 1.5px var(--accent)' } : undefined}>
                              <FrameTile nodeId={id} f={f} latMs={latOf(id)} info={nodeById[id]} order={droneOrder} onClick={() => setFocusId(id)} />
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </main>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MeshDashboard />);
  </script>
</body>
</html>
