<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Mesh Drone</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Client Socket.IO — nối tới middleware Node.js (server.js) chạy cùng origin -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      /* Nền & độ cao (elevation) */
      --bg:          #121212;
      --surface-1:   #1E1E1E;   /* panel / card */
      --surface-2:   #252525;   /* phần tử lồng trong card: hàng dữ liệu, ô ảnh */
      --surface-3:   #2E2E2E;   /* hover */
      --track:       rgba(255, 255, 255, 0.07);
      --shadow:      0 1px 2px rgba(0, 0, 0, .4), 0 4px 12px rgba(0, 0, 0, .25);
      --radius:      8px;

      /* Màu nhấn & chữ */
      --accent:      #22D3EE;
      --accent-soft: rgba(34, 211, 238, .14);
      --text:        #E4E4E7;
      --text-2:      #A1A1AA;
      --text-3:      #71717A;
      --grid:        rgba(255, 255, 255, 0.06);   /* lưới biểu đồ mờ trên nền #1E1E1E */

      /* Trạng thái */
      --good:        #22C55E;
      --warning:     #FACC15;
      --critical:    #EF4444;

      /* Màu nhóm 1/2/3 leaf (biểu đồ so sánh) */
      --leaf-1:      #3987e5;
      --leaf-2:      #d95926;
      --leaf-3:      #199e70;

      --panel:       var(--surface-1);
      --panel-2:     var(--surface-2);
      --font-mono:   'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, monospace;
      color-scheme: dark;
    }
    html, body { background: var(--bg); color: var(--text); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }

    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .panel { background: var(--surface-1); border: 1px solid rgba(255, 255, 255, .05); border-radius: var(--radius); box-shadow: var(--shadow); }
    .nested { background: var(--surface-2); border-radius: 6px; }
    .panel-h { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9CA3AF; }

    /* Nút & nhóm nút chọn */
    .btn { background: var(--surface-2); color: #D4D4D8; border-radius: 6px; padding: 6px 12px; font-size: 12px; transition: background .15s, color .15s; }
    .btn:hover { background: var(--surface-3); color: #fff; }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .seg { display: inline-flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 8px; }
    .seg button { font-size: 12px; padding: 4px 12px; border-radius: 6px; color: var(--text-2); transition: background .15s, color .15s; white-space: nowrap; }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

    /* Tab so sánh: nhóm nút liền nhau, chip, chấm ghi, icon thông tin */
    .btn-group { display: inline-flex; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, .06); }
    .btn-group .btn { border-radius: 0; }
    .btn-group .btn + .btn { border-left: 1px solid rgba(255, 255, 255, .06); }
    .chip { display: inline-flex; align-items: center; gap: 6px; border-width: 1px; border-style: solid; border-radius: 9999px;
            background: transparent; padding: 3px 10px; font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums;
            transition: border-color .15s, color .15s; }
    .rec-dot { width: 8px; height: 8px; border-radius: 9999px; flex-shrink: 0; background: #52525B; }
    .rec-dot.rec-on { background: var(--critical); animation: recPulse 1.4s ease-out infinite; }
    @keyframes recPulse {
      0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, .6); }
      70%  { box-shadow: 0 0 0 5px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .info-btn { width: 16px; height: 16px; border-radius: 9999px; border: 1px solid rgba(255, 255, 255, .25); color: var(--text-2);
                font: italic 600 10px/14px Georgia, serif; text-align: center; transition: color .15s, border-color .15s; }
    .info-btn:hover, .info-btn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
    .info-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .bar { transition: d .22s ease, opacity .15s ease; }
    .fade-in { animation: fadeIn .15s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Chấm trạng thái phát sáng */
    .dot { width: 7px; height: 7px; border-radius: 9999px; flex-shrink: 0; }
    .dot-ok    { background: var(--good);     box-shadow: 0 0 6px rgba(34, 197, 94, .7); animation: dotPulse 2s ease-in-out infinite; }
    .dot-bad   { background: var(--critical); box-shadow: 0 0 6px rgba(239, 68, 68, .55); }
    .dot-stale { background: var(--warning);  box-shadow: 0 0 6px rgba(250, 204, 21, .5); }
    .dot-idle  { background: #52525B; }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 3px rgba(34, 197, 94, .5); }
      50%      { box-shadow: 0 0 10px rgba(34, 197, 94, .95); }
    }

    /* Empty state: lưới toạ độ + drone line-art */
    .grid-bg {
      background-color: var(--surface-2);
      background-image:
        linear-gradient(rgba(34, 211, 238, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, .055) 1px, transparent 1px);
      background-size: 28px 28px;
      background-position: center center;
    }
    .scanline {
      position: absolute; left: 0; right: 0; height: 1px; top: 0;
      background: linear-gradient(90deg, transparent, rgba(34, 211, 238, .35), transparent);
      animation: scanY 5s linear infinite;
    }
    @keyframes scanY { from { top: 0%; } to { top: 100%; } }
    @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: .85; } }
    .drone-breathe { animation: breathe 3.2s ease-in-out infinite; }
    .cone-pulse    { animation: breathe 2.4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .dot-ok, .drone-breathe, .cone-pulse, .rec-dot.rec-on, .fade-in { animation: none !important; }
      .scanline { display: none; }
      *, *::before, *::after { transition-duration: 0s !important; }
    }

    [data-tile]:fullscreen { background: #000; }
  </style>
</head>
<body class="antialiased overflow-x-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ================================================================
     *  Toàn bộ số liệu đến từ middleware qua Socket.IO, đúng
     *  UART_PROTOCOL.md (sự kiện: connect, disconnect, status,
     *  telemetry, frame). Không có dữ liệu giả lập: những gì Root Node
     *  chưa gửi thì hiển thị "chưa có dữ liệu".
     *
     *  Tab "So sánh 1/2/3 leaf": mỗi lần nhận telemetry, dashboard tính
     *  tốc độ thay đổi của các bộ đếm (frames_ok, frames_drop, chunks)
     *  so với lần telemetry trước, cộng số byte JPEG thực nhận qua sự
     *  kiện 'frame', rồi xếp mẫu đo vào nhóm theo node_count mà Root
     *  báo. Số liệu tích luỹ được lưu trong localStorage của trình
     *  duyệt để có thể đo lần lượt 1 leaf → 2 leaf → 3 leaf rồi so sánh.
     * ================================================================ */

    /* ── Hằng số TỰ ĐIỀN cho thanh tiến trình ────────────────────────
     * Telemetry chỉ gửi giá trị "free" (heap_def, psram_free), KHÔNG
     * gửi dung lượng tổng, nên dashboard không tự đoán tổng.
     *  - null  -> thanh vẽ theo min/max quan sát được trong phiên này,
     *             có chú thích "theo phiên".
     *  - số    -> thanh vẽ theo phần trăm thật.
     * Gợi ý lấy số: in heap_caps_get_total_size(MALLOC_CAP_DEFAULT) / ESP.getPsramSize() trên Root
     * Node (Arduino) rồi điền byte vào đây; FPS_TARGET là FPS mục tiêu
     * mà nhóm đặt ra cho luồng ảnh (vd 5).
     * ---------------------------------------------------------------- */
    const HEAP_TOTAL_BYTES = null;
    const PSRAM_TOTAL_BYTES = null;
    const FPS_TARGET = null;
    // Ngưỡng heap guard của Root (mesh_config.h HEAP_DEF_CRITICAL_BYTES): tô đỏ heap DEFAULT dưới mức này
    const HEAP_DEF_CRITICAL_BYTES = 16384;

    const HAS_IO = typeof io !== 'undefined';     // false khi mở file:// trực tiếp
    const LEAVES = [1, 2, 3];
    const LEAF_COLOR = { 1: 'var(--leaf-1)', 2: 'var(--leaf-2)', 3: 'var(--leaf-3)' };
    const STORE_KEY = 'meshDashCompare.v1';
    const TIMELINE_MAX = 900;
    const STALE_FRAME_MS = 5000;
    const STALE_TELEMETRY_MS = 6000;
    const HIST_MAX = 60;

    const METRICS = [
      { key: 'fps',        label: 'FPS tổng (Root ghép xong)',     unit: 'fps',     digits: 2 },
      { key: 'fpsPerNode', label: 'FPS trung bình mỗi drone',      unit: 'fps',     digits: 2 },
      { key: 'kbps',       label: 'Thông lượng ảnh tới dashboard', unit: 'KB/s',    digits: 1 },
      { key: 'dropPct',    label: 'Tỉ lệ frame bị hủy',            unit: '%',       digits: 1 },
      { key: 'chunksPs',   label: 'Chunk nhận tại Root',           unit: 'chunk/s', digits: 1 },
      { key: 'frameKB',    label: 'Kích thước frame trung bình',   unit: 'KB',      digits: 1 },
      { key: 'heapDefKB',  label: 'Heap DEFAULT trống tại Root (heap malloc dùng được)', unit: 'KB', digits: 0 },
      { key: 'latMs',      label: 'Latency chụp → Root ghép xong', unit: 'ms',      digits: 1 },
    ];
    // Cột phụ trong CSV (theo từng mẫu), không vẽ biểu đồ riêng
    const CSV_EXTRA = ['latMinMs', 'latMaxMs', 'latN', 'uartDrop',   // uartDrop: bộ đếm uart_drop tích luỹ của Root
      // Root FW ≥ 2026-10-01a (thiếu → ô trống): uartDefer/logDrop tích luỹ; loopMaxMs theo cửa sổ 1 chu kỳ telemetry.
      // Heap (UART_PROTOCOL.md §4.2): DEFAULT = heap malloc dùng được (esp_get_free_heap_size);
      // INTERNAL = ESP.getFreeHeap(), gồm cả IRAM trống malloc thường không dùng được (~47 KB hơn DEFAULT).
      // heapIntKB = heap_int (FW cũ: heap_free); heapDefMinWinKB = DEFAULT thấp nhất trong cửa sổ (FW 10-01a: heap_min_win);
      // heapIntMinBootKB = ESP.getMinFreeHeap() từ lúc khởi động (FW 10-01a: heap_min_boot);
      // heapDefLargestKB = khối trống lớn nhất của DEFAULT, thấp nhất trong cửa sổ (FW ≥ 2026-10-01b)
      'uartDefer', 'logDrop', 'loopMaxMs', 'heapIntKB', 'heapDefMinWinKB', 'heapIntMinBootKB', 'heapDefLargestKB',
      // frameMaxBytesWin/Boot (FW ≥ 2026-10-01b): frame JPEG lớn nhất Root ghép xong trong cửa sổ (0 = không có) / từ lúc khởi động, byte
      'frameMaxBytesWin', 'frameMaxBytesBoot',
      'lateChunkDrop'];   // lateChunkDrop: chunk trễ của frame đã đóng bị Root bỏ (tích luỹ)
    // Cột mô tả cấu hình trong CSV (chuỗi): [khoá trong mẫu, tên cột].
    // n_leaf = số Leaf còn trong cây đang gửi NSTAT (biết fw) — khác cột "leaf" (= node_count của Root, gồm cả node chưa gửi NSTAT).
    // fw_leaf = "id:fw;…"; stagger = "stg" trong NSTAT: 1 / 0 / mix (Leaf lệch cấu hình), trống = Leaf fw cũ không gửi.
    const CSV_META = [['nLeaf', 'n_leaf'], ['fwRoot', 'fw_root'], ['fwLeaf', 'fw_leaf'], ['stagger', 'stagger']];
    // Cột topology trong CSV: [khoá trong mẫu, tên cột]. Chỉ tính node còn trong cây và
    // NSTAT chưa quá NODE_STALE_MS. hop_max = độ sâu lớn nhất, rssi_min = liên kết yếu nhất (theo link_rssi).
    // lat_by_node: latency trung bình từng node trong chu kỳ telemetry (telemetry "lat_by_node").
    // big_by_node: "id:N;…" — số frame Leaf bỏ vì > MAX_FRAME_SIZE, tích luỹ (nodes[].big, Leaf ≥ 2026-10-01b).
    const CSV_TOPO = [['hopMax', 'hop_max'], ['rssiMin', 'rssi_min_dbm'], ['hopByNode', 'hop_by_node'], ['rssiByNode', 'rssi_by_node'], ['latByNode', 'lat_by_node'], ['bigByNode', 'big_by_node']];

    // ── Topology / NSTAT (telemetry "tree" + "nodes", UART_PROTOCOL.md §4.2) ──
    const RSSI_GOOD = -65;          // > -65 dBm: mạnh
    const RSSI_WEAK = -80;          // -65 … -80: trung bình; < -80: yếu
    const NODE_STALE_MS = 6000;     // age_ms lớn hơn → vẽ mờ, "mất tín hiệu"
    const rssiColor = (r) => (!Number.isFinite(r) ? 'var(--text-3)' : r > RSSI_GOOD ? 'var(--good)' : r >= RSSI_WEAK ? 'var(--warning)' : 'var(--critical)');
    // RSSI của nhánh node ↔ node cha: "link_rssi" (Root đã ưu tiên số đo phía AP, rồi mới tới phía station).
    // Root firmware cũ chưa có khóa "link_rssi" → dùng "rssi" phía station.
    const linkRssi = (n) => (!n ? null : 'link_rssi' in n ? n.link_rssi : n.rssi);
    // Nguồn số đo link_rssi ("link_rssi_src"; Root 2026-09-30a gửi "link_src" = ap/sta)
    const LINK_SRC_TEXT = {
      ap_parent: 'đo tại AP của node cha',
      ap_child: 'đo tại AP của node con (liên kết chiều ngược)',
      sta: 'đo tại station của node con',
      root_sta: 'đo tại station của Root',
      ap: 'đo tại AP của node cha',
    };
    const linkSrcText = (n) => {
      const src = n?.link_rssi_src ?? n?.link_src;
      if (src) return `Nguồn RSSI: ${LINK_SRC_TEXT[src] || src}`;
      if (n && 'link_rssi' in n) return 'Nguồn RSSI: chưa có số đo';
      return 'Nguồn RSSI: station của node con (Root firmware cũ)';
    };
    const shortId = (id) => { const s = String(id); return s.length > 5 ? `…${s.slice(-4)}` : s; };
    // Node mất tín hiệu: rời cây (hop null) hoặc NSTAT quá cũ. fw = null + age null = chưa từng gửi NSTAT, KHÔNG coi là mất.
    const nodeLost = (n) => !!n && (n.hop == null || (Number.isFinite(n.age_ms) && n.age_ms > NODE_STALE_MS));
    // Self-healing: số đo mới theo luồng dữ liệu (telemetry "heal_events", mỗi node: rời mesh → chunk đầu
    // tiên sau đó) dùng cho biểu đồ/thống kê; số đo cũ "last_self_heal_ms" giữ lại để so sánh.
    const HEAL_METRIC = { key: 'healNew', label: 'Self-healing (theo luồng dữ liệu)', unit: 'ms', digits: 0 };
    const HEAL_OLD_METRIC = { key: 'heal', label: 'Self-healing (cách cũ: last_self_heal_ms)', unit: 'ms', digits: 0 };
    const HEAL_LOG_MAX = 500;       // số sự kiện self-healing giữ trong store (xuất CSV)
    const HEAL_SRC_TEXT = { list: 'node rời danh sách mesh', last_chunk: 'chunk cuối (không thấy node rời mesh)' };
    // esp_reset_reason() (ESP-IDF 4.4) — "rst" trong NSTAT của Leaf
    const RST_NAME = { 0: 'UNKNOWN', 1: 'POWERON', 2: 'EXT', 3: 'SW', 4: 'PANIC', 5: 'INT_WDT', 6: 'TASK_WDT', 7: 'WDT', 8: 'DEEPSLEEP', 9: 'BROWNOUT', 10: 'SDIO' };
    const RST_BAD = new Set([4, 5, 6, 7, 9]);   // reset bất thường → tô vàng
    const rstText = (r) => (Number.isFinite(r) ? `rst ${RST_NAME[r] || r}` : 'rst —');
    const fmtUptime = (s) => {
      if (!Number.isFinite(s)) return '—';
      if (s < 60) return `${s}s`;
      if (s < 3600) return `${Math.floor(s / 60)}p`;
      return `${Math.floor(s / 3600)}h${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}`;
    };

    // ── Đánh số drone theo thứ tự kết nối ────────────────────────
    // Bảng nodeId (chuỗi) → số thứ tự, lưu riêng khỏi STORE_KEY để "Xoá dữ liệu" của tab so sánh
    // không đụng tới. Node đã có số giữ nguyên số đó mãi (rời mạng rồi vào lại vẫn cùng số);
    // số của node đã rời mạng không bị tái sử dụng. Root không bao giờ được đánh số.
    const DRONE_ORDER_KEY = 'meshDashDroneOrder.v1';
    const KNOWN_ROOT_IDS = ['2846999225'];

    /* Hàm thuần: trả về bảng có thêm số cho các node trong nodeIds chưa có số, theo đúng thứ tự
     * mảng; số mới = số lớn nhất hiện có + 1. rootIds: các ID cần bỏ qua (ngoài KNOWN_ROOT_IDS).
     * Không có node mới → trả lại chính `map` (cùng tham chiếu) để React không render/ghi lại vô ích. */
    function assignDroneNumbers(map, nodeIds, rootIds = []) {
      const src = map && typeof map === 'object' ? map : {};
      if (!Array.isArray(nodeIds) || nodeIds.length === 0) return src;
      const skip = new Set([...KNOWN_ROOT_IDS, ...rootIds.filter((r) => r != null).map(String)]);
      let next = Object.values(src).reduce((m, v) => (Number.isFinite(v) && v > m ? v : m), 0) + 1;
      let out = src;
      nodeIds.forEach((raw) => {
        if (raw == null || raw === '') return;
        const id = String(raw);
        if (skip.has(id) || out[id] != null) return;
        if (out === src) out = { ...src };
        out[id] = next++;
      });
      return out;
    }

    // Helper hiển thị DUY NHẤT cho tên drone: "Drone N", chưa có trong bảng → "Drone ?".
    const droneLabel = (nodeId, order) => {
      const n = order ? order[String(nodeId)] : undefined;
      return `Drone ${Number.isFinite(n) ? n : '?'}`;
    };

    function loadDroneOrder() {
      try {
        const d = JSON.parse(localStorage.getItem(DRONE_ORDER_KEY) || '{}');
        if (!d || typeof d !== 'object' || Array.isArray(d)) return {};
        // Chỉ nhận số nguyên dương — dữ liệu hỏng thì bỏ mục đó, không làm hỏng cả bảng
        const out = {};
        Object.entries(d).forEach(([id, n]) => { if (Number.isInteger(n) && n > 0) out[id] = n; });
        return out;
      } catch (e) { return {}; }
    }
    function saveDroneOrder(m) {
      try { localStorage.setItem(DRONE_ORDER_KEY, JSON.stringify(m)); } catch (e) { /* bỏ qua */ }
    }

    // ── Tiện ích ─────────────────────────────────────────────────
    function timeAgo(ts) {
      if (!ts) return 'chưa có';
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 2) return 'vừa xong';
      if (s < 60) return `${s}s trước`;
      return `${Math.floor(s / 60)}p trước`;
    }
    const fmt = (v, d = 1) => (v == null || !Number.isFinite(v) ? '—' : v.toFixed(d));
    const kb = (bytes) => (bytes == null ? '—' : `${Math.round(bytes / 1024)} KB`);
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const dropColor = (p) => (p == null ? 'var(--text-3)' : p < 5 ? 'var(--good)' : p < 15 ? 'var(--warning)' : 'var(--critical)');

    function emptyStats() {
      const s = {};
      LEAVES.forEach((l) => { s[l] = { samples: 0, metrics: {}, heal: [], healNew: [] }; });
      return s;
    }
    const emptyStore = () => ({ stats: emptyStats(), timeline: [], healLog: [] });
    function loadStore() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const d = JSON.parse(raw);
          if (d && d.stats && Array.isArray(d.timeline) && LEAVES.every((l) => d.stats[l])) {
            // Store của bản dashboard cũ chưa có healNew / healLog
            LEAVES.forEach((l) => {
              if (!Array.isArray(d.stats[l].heal)) d.stats[l].heal = [];
              if (!Array.isArray(d.stats[l].healNew)) d.stats[l].healNew = [];
            });
            if (!Array.isArray(d.healLog)) d.healLog = [];
            return d;
          }
        }
      } catch (e) { /* localStorage không khả dụng — bắt đầu rỗng */ }
      return emptyStore();
    }
    function saveStore(d) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) { /* bỏ qua */ }
    }
    function aggAdd(a, v) {
      if (!a) return { n: 1, sum: v, sumsq: v * v, min: v, max: v };
      return { n: a.n + 1, sum: a.sum + v, sumsq: a.sumsq + v * v, min: Math.min(a.min, v), max: Math.max(a.max, v) };
    }
    const aggMean = (a) => (a && a.n ? a.sum / a.n : null);
    const aggSd = (a) => {
      if (!a || a.n < 2) return null;
      const m = a.sum / a.n;
      return Math.sqrt(Math.max(0, (a.sumsq - a.n * m * m) / (a.n - 1)));
    };
    function aggOf(list) {
      return list.reduce((a, v) => aggAdd(a, v), null);
    }
    function niceMax(v) {
      if (!(v > 0)) return 1;
      const p = Math.pow(10, Math.floor(Math.log10(v)));
      for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * p) return m * p;
      return 10 * p;
    }
    function addSample(store, s) {
      const b = store.stats[s.leaf];
      const metrics = { ...b.metrics };
      METRICS.forEach((m) => { if (Number.isFinite(s[m.key])) metrics[m.key] = aggAdd(metrics[m.key], s[m.key]); });
      const timeline = [...store.timeline, s];
      if (timeline.length > TIMELINE_MAX) timeline.splice(0, timeline.length - TIMELINE_MAX);
      return { ...store, stats: { ...store.stats, [s.leaf]: { ...b, samples: b.samples + 1, metrics } }, timeline };
    }
    const pushHealLog = (log, e) => [...(log || []), e].slice(-HEAL_LOG_MAX);
    // Cách cũ: last_self_heal_ms (Root, 1 giá trị cho cả mesh)
    function addHeal(store, leaf, ms, t) {
      const b = store.stats[leaf];
      return { ...store, stats: { ...store.stats, [leaf]: { ...b, heal: [...b.heal, ms] } },
               healLog: pushHealLog(store.healLog, { t, leaf, kind: 'cu', ms }) };
    }
    // Cách mới: 1 phần tử của telemetry "heal_events"
    function addHealNew(store, leaf, ev, t) {
      const b = store.stats[leaf];
      return { ...store, stats: { ...store.stats, [leaf]: { ...b, healNew: [...(b.healNew || []), ev.ms] } },
               healLog: pushHealLog(store.healLog, { t, leaf, kind: 'moi', id: ev.id, ms: ev.ms, src: ev.start_src }) };
    }

    // ── Thành phần giao diện dùng chung ─────────────────────────
    // state: 'ok' (xanh, pulse) | 'bad' (đỏ) | 'stale' (vàng) | 'idle' (xám)
    function StatusBadge({ state, label, className = '' }) {

    function Row({ k, v, cls = 'text-zinc-50', badge }) {

    function ProgressBar({ frac, color = 'var(--accent)' }) {

          {frac != null && Number.isFinite(frac) && (

    // Sparkline chỉ vẽ khi có >= 2 điểm thật
    function Sparkline({ data, color = 'var(--accent)', w = 96, h = 28 }) {
      const pts = (data || []).filter((v) => Number.isFinite(v));
      if (pts.length < 2) {
        return <div className="text-[10px] text-zinc-500 text-right leading-tight" style={{ width: w }}>chưa đủ<br />dữ liệu</div>;
      }
      const min = Math.min(...pts), max = Math.max(...pts);
      const span = max - min || 1;
      const x = (i) => 1 + (i / (pts.length - 1)) * (w - 4);
      const y = (v) => (max === min ? h / 2 : 2 + (1 - (v - min) / span) * (h - 4));
      const last = pts.length - 1;
      return (
        <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="shrink-0" aria-hidden="true">
          <polyline fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" opacity=".9"
                    points={pts.map((v, i) => `${x(i)},${y(v)}`).join(' ')} />
          <circle cx={x(last)} cy={y(pts[last])} r="2.2" fill={color} />

    function MetricCard({ label, value, unit, valueColor = '#FAFAFA', spark, sparkColor, bar, barColor, note }) {

              {has ? (

                </div>

                <div className="text-[12px] leading-6 text-zinc-500">chưa có dữ liệu</div>

            </div>
            {spark !== undefined && <Sparkline data={spark} color={sparkColor} />}
          </div>
          {bar !== undefined && <ProgressBar frac={has ? bar : null} color={barColor} />}
          {note && <div className="text-[10px] text-zinc-500 -mt-0.5">{note}</div>}

    // Drone line-art tự vẽ (4 cánh quạt, thân, camera + vùng quét)
    function DroneArt({ className = '' }) {

    function SignalEmpty({ title, subtitle, small = false }) {
      return (
        <div className="relative w-full h-full grid-bg overflow-hidden rounded-md flex flex-col items-center justify-center text-center px-3">
          <div className="scanline"></div>
          <DroneArt className={small ? 'w-16 h-auto mb-1.5' : 'w-40 sm:w-52 h-auto mb-4'} />
          <div className={small ? 'text-[12px] font-semibold text-zinc-200' : 'text-[15px] font-semibold text-zinc-100'} style={{ color: small ? undefined : 'var(--text)' }}>
            {title}
          </div>
          {subtitle && <div className={`mt-1 text-zinc-400 max-w-md ${small ? 'text-[10px] mono' : 'text-[12px]'}`}>{subtitle}</div>}
